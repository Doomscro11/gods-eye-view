# fly.toml app configuration file generated for gods-eye-view-demo on 2026-09-09T15:01:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "gods-eye-view-demo"
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

# The Vite dev server doubles as the feed-proxy layer; it needs real memory.

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
  processes = ['app']

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '30s', interval = '30s', method = 'GET', path = '/', timeout = '10s' }]
