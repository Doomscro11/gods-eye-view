# Fly.io configuration for the public community demo instance.
#
# One-time setup (https://fly.io):
#   fly auth login
#   fly apps create gods-eye-view-demo        # or your own name — also update `app` below
#   fly secrets set CESIUM_ION_TOKEN=…         # optional provider credential
#   fly deploy                                 # first deploy; pushes to main take over after that
#
# IMPORTANT — a public demo brokers its configured keys to every visitor:
# restrict provider keys at the provider and set quotas/budget alerts BEFORE
# deploying. Provider Settings is unavailable in production preview mode on
# shared instances; server-side provider proxies still read runtime secrets.

app = "gods-eye-view-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# 1 GB repeatedly OOM-killed the previous Vite dev runtime. Keep 2 GB while the
# production-preview runtime is measured; reduce only after observed headroom.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/healthz"
