name: Deploy demo

# Push-to-deploy for the public community demo instance on Fly.io.
# Requires the FLY_API_TOKEN repository secret (fly tokens create / fly auth token).
# Optional runtime keys (CESIUM_ION_TOKEN etc.) are Fly app secrets, set once
# with `fly secrets set` — they are NOT in this file and NOT in the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Fly.io deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
