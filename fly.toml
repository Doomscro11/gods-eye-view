# fly.toml app configuration file generated for gods-eye-view-demo on 2026-09-09T14:33:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gods-eye-view-demo'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
